<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOAL Counter | PETCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b16;
      --panel: rgba(14, 22, 42, 0.78);
      --line: rgba(125, 211, 252, 0.18);
      --text: #e8f1ff;
      --muted: #93a4c4;
      --gold: #ffd166;
      --cyan: #5ce1ff;
      --pink: #ff6bd6;
      --ok: #3dff9a;
      --danger: #ff5d7a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Prompt", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(92, 225, 255, 0.16), transparent 50%),
        radial-gradient(900px 500px at 100% 0%, rgba(255, 107, 214, 0.12), transparent 45%),
        radial-gradient(700px 400px at 50% 110%, rgba(255, 209, 102, 0.1), transparent 50%),
        var(--bg);
      overflow-x: hidden;
    }

    .stars, .stars:before, .stars:after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 80px 120px, #9adfff, transparent),
        radial-gradient(1.5px 1.5px at 160px 70px, #fff, transparent),
        radial-gradient(1px 1px at 240px 180px, #ffd166, transparent),
        radial-gradient(1px 1px at 320px 40px, #fff, transparent);
      background-size: 380px 220px;
      opacity: 0.35;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    .card {
      width: min(560px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 28px 24px 24px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--pink));
      box-shadow: 0 0 16px var(--cyan);
    }
    .chip {
      font-size: 12px;
      color: var(--gold);
      border: 1px solid rgba(255, 209, 102, 0.35);
      background: rgba(255, 209, 102, 0.08);
      padding: 4px 10px;
      border-radius: 999px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .sub { color: var(--muted); margin-bottom: 22px; font-size: 14px; }

    label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px 4px; }
    input[type="text"], input[type="password"], input[type="number"] {
      width: 100%;
      background: rgba(6, 10, 22, 0.7);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      margin-bottom: 14px;
    }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(92, 225, 255, 0.15); }

    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      border-radius: 16px;
      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      width: 100%;
      padding: 14px 16px;
      color: #061018;
      background: linear-gradient(135deg, var(--cyan), #7af0c8);
      box-shadow: 0 10px 30px rgba(92, 225, 255, 0.25);
      font-size: 16px;
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      padding: 8px 10px;
      font-size: 13px;
    }
    .btn-danger {
      background: rgba(255, 93, 122, 0.12);
      color: #ffb0be;
      border: 1px solid rgba(255, 93, 122, 0.25);
      padding: 8px 12px;
      font-size: 13px;
    }
    .error {
      display: none;
      color: var(--danger);
      background: rgba(255, 93, 122, 0.1);
      border: 1px solid rgba(255, 93, 122, 0.25);
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .hello { font-size: 14px; color: var(--muted); }
    .hello b { color: var(--cyan); font-weight: 600; }

    .counter-box {
      text-align: center;
      padding: 18px 8px 8px;
    }
    .label-remain {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .number {
      font-family: "Orbitron", sans-serif;
      font-weight: 800;
      font-size: clamp(52px, 14vw, 84px);
      letter-spacing: 2px;
      background: linear-gradient(180deg, #fff 10%, var(--cyan) 80%, var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(92, 225, 255, 0.15);
      line-height: 1;
    }
    .number.pulse { animation: pulse 0.25s ease; }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    .hit {
      width: 100%;
      margin: 22px 0 14px;
      padding: 22px 16px;
      font-size: 28px;
      color: #1a0b16;
      background: linear-gradient(135deg, var(--gold), #ff8a4c 55%, var(--pink));
      box-shadow: 0 16px 40px rgba(255, 107, 214, 0.22);
      border-radius: 22px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .adj {
      padding: 14px;
      font-size: 18px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .set-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .set-row input { margin: 0; }
    .set-row .btn {
      white-space: nowrap;
      padding: 0 16px;
      background: rgba(92, 225, 255, 0.12);
      color: var(--cyan);
      border: 1px solid rgba(92, 225, 255, 0.25);
    }

    .tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding-top: 6px;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      user-select: none;
    }
    .switch {
      width: 44px; height: 26px; border-radius: 999px;
      background: #1b2438;
      border: 1px solid var(--line);
      position: relative;
      cursor: pointer;
    }
    .switch i {
      position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: #7d8aa8;
      transition: 0.18s ease;
    }
    .switch.on { background: rgba(61, 255, 154, 0.18); border-color: rgba(61, 255, 154, 0.4); }
    .switch.on i { left: 21px; background: var(--ok); }

    .hint { margin-top: 14px; font-size: 12px; color: #6f80a3; text-align: center; }

    /* Goal overlay */
    .goal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      background: rgba(4, 7, 16, 0.82);
      padding: 20px;
    }
    .goal.show { display: grid; }
    .goal-card {
      width: min(520px, 100%);
      text-align: center;
      background: linear-gradient(180deg, rgba(28, 20, 8, 0.95), rgba(10, 14, 28, 0.95));
      border: 1px solid rgba(255, 209, 102, 0.4);
      border-radius: 28px;
      padding: 36px 24px 28px;
      box-shadow: 0 0 80px rgba(255, 209, 102, 0.18);
      animation: pop 0.45s ease;
    }
    @keyframes pop {
      from { transform: scale(0.86); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .trophy { font-size: 72px; line-height: 1; filter: drop-shadow(0 8px 18px rgba(255,209,102,0.4)); }
    .goal-card h2 {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(42px, 12vw, 64px);
      color: var(--gold);
      margin: 8px 0 6px;
    }
    .goal-card p { color: #d9e4ff; margin-bottom: 20px; }
    canvas#confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 21;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="stars"></div>

  <div class="wrap">
    <!-- LOGIN -->
    <section class="card" id="loginCard">
      <div class="brand">
        <div class="logo"><span class="dot"></span> GOAL Counter</div>
        <span class="chip">PETCH SYSTEM</span>
      </div>
      <h1>เข้าสู่ระบบ</h1>
      <p class="sub">ใส่ชื่อผู้ใช้กับรหัสผ่านที่ได้รับ แล้วเริ่มนับถอยหลังได้เลย</p>
      <div class="error" id="loginError">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>
      <form id="loginForm" autocomplete="off">
        <label for="user">ชื่อผู้ใช้</label>
        <input id="user" type="text" placeholder="User" required />
        <label for="pass">รหัสผ่าน</label>
        <input id="pass" type="password" placeholder="Password" required />
        <button class="btn btn-primary" type="submit">เข้าสู่ระบบ</button>
      </form>
    </section>

    <!-- APP -->
    <section class="card hidden" id="appCard">
      <div class="topbar">
        <div class="hello">ยินดีต้อนรับ <b id="who">PETCH</b></div>
        <button class="btn btn-danger" id="logoutBtn" type="button">ออกจากระบบ</button>
      </div>
      <div class="counter-box">
        <div class="label-remain">เหลืออีก</div>
        <div class="number" id="countView">15,407</div>
      </div>

      <button class="btn hit" id="hitBtn" type="button">กด เพื่อลด 1</button>

      <div class="row">
        <button class="btn adj" id="minusBtn" type="button">− ลด</button>
        <button class="btn adj" id="plusBtn" type="button">+ เพิ่ม</button>
      </div>

      <div class="set-row">
        <input id="setInput" type="number" min="0" step="1" placeholder="ตั้งค่าตัวเลขใหม่" />
        <button class="btn" id="setBtn" type="button">ตั้งค่า</button>
      </div>

      <div class="tools">
        <label class="toggle">
          <span class="switch" id="autoSwitch"><i></i></span>
          นับอัตโนมัติทุก 1 วินาที
        </label>
        <button class="btn btn-ghost" id="resetBtn" type="button">รีเซ็ตเป็น 15,407</button>
      </div>
      <p class="hint">ข้อมูลถูกจำไว้ในเครื่องนี้ ปิดแท็บแล้วเปิดใหม่ตัวเลขยังอยู่</p>
    </section>
  </div>

  <div class="goal" id="goal">
    <div class="goal-card">
      <div class="trophy">🏆</div>
      <h2>GOAL</h2>
      <p>สุดยอดเลย PETCH!<br>นับครบแล้ว ภารกิจสำเร็จ</p>
      <button class="btn btn-primary" id="againBtn" type="button">เริ่มใหม่ที่ 15,407</button>
    </div>
  </div>
  <canvas id="confetti"></canvas>

  <script>
    const USER = "PETCH";
    const PASS = "Admin";
    const DEFAULT_COUNT = 15407;
    const KEYS = {
      session: "petch_logged_in",
      count: "petch_count",
      auto: "petch_auto"
    };

    const loginCard = document.getElementById("loginCard");
    const appCard = document.getElementById("appCard");
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const countView = document.getElementById("countView");
    const goalEl = document.getElementById("goal");
    const autoSwitch = document.getElementById("autoSwitch");
    const setInput = document.getElementById("setInput");

    let count = DEFAULT_COUNT;
    let autoOn = false;
    let timer = null;
    let celebrating = false;

    function formatNum(n) {
      return Number(n).toLocaleString("en-US");
    }

    function save() {
      localStorage.setItem(KEYS.count, String(count));
      localStorage.setItem(KEYS.auto, autoOn ? "1" : "0");
    }

    function render() {
      countView.textContent = formatNum(count);
      countView.classList.remove("pulse");
      void countView.offsetWidth;
      countView.classList.add("pulse");
      setInput.value = count;
      if (count <= 0 && !celebrating) showGoal();
    }

    function setCount(n, fromUser) {
      count = Math.max(0, Math.floor(Number(n) || 0));
      save();
      render();
    }

    function dec(by) {
      if (celebrating) return;
      setCount(count - by);
    }

    function showApp() {
      loginCard.classList.add("hidden");
      appCard.classList.remove("hidden");
      loadState();
      if (autoOn && count > 0) startAuto();
    }

    function showLogin() {
      appCard.classList.add("hidden");
      loginCard.classList.remove("hidden");
      stopAuto();
    }

    function loadState() {
      const saved = localStorage.getItem(KEYS.count);
      count = saved === null ? DEFAULT_COUNT : Math.max(0, parseInt(saved, 10) || 0);
      autoOn = localStorage.getItem(KEYS.auto) === "1";
      autoSwitch.classList.toggle("on", autoOn);
      celebrating = false;
      goalEl.classList.remove("show");
      render();
      if (count <= 0) showGoal();
    }

    function startAuto() {
      stopAuto();
      timer = setInterval(() => {
        if (!autoOn || celebrating) return;
        if (count <= 0) {
          stopAuto();
          return;
        }
        dec(1);
      }, 1000);
    }

    function stopAuto() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    function showGoal() {
      celebrating = true;
      stopAuto();
      count = 0;
      save();
      render();
      goalEl.classList.add("show");
      burstConfetti();
    }

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const u = document.getElementById("user").value.trim();
      const p = document.getElementById("pass").value;
      if (u === USER && p === PASS) {
        localStorage.setItem(KEYS.session, "1");
        loginError.style.display = "none";
        showApp();
      } else {
        loginError.style.display = "block";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem(KEYS.session);
      showLogin();
    });

    document.getElementById("hitBtn").addEventListener("click", () => dec(1));
    document.getElementById("minusBtn").addEventListener("click", () => dec(1));
    document.getElementById("plusBtn").addEventListener("click", () => {
      if (celebrating) {
        celebrating = false;
        goalEl.classList.remove("show");
      }
      setCount(count + 1);
    });
    document.getElementById("setBtn").addEventListener("click", () => {
      celebrating = false;
      goalEl.classList.remove("show");
      setCount(setInput.value);
    });
    document.getElementById("resetBtn").addEventListener("click", () => {
      celebrating = false;
      goalEl.classList.remove("show");
      setCount(DEFAULT_COUNT);
    });
    document.getElementById("againBtn").addEventListener("click", () => {
      celebrating = false;
      goalEl.classList.remove("show");
      setCount(DEFAULT_COUNT);
      if (autoOn) startAuto();
    });

    autoSwitch.addEventListener("click", () => {
      autoOn = !autoOn;
      autoSwitch.classList.toggle("on", autoOn);
      save();
      if (autoOn && count > 0 && !celebrating) startAuto();
      else stopAuto();
    });

    /* simple confetti */
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    let pieces = [];
    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }
    addEventListener("resize", resize);
    resize();

    function burstConfetti() {
      pieces = [];
      const colors = ["#ffd166", "#5ce1ff", "#ff6bd6", "#3dff9a", "#ffffff"];
      for (let i = 0; i < 160; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * 80,
          r: 3 + Math.random() * 5,
          c: colors[i % colors.length],
          vx: -2 + Math.random() * 4,
          vy: 2 + Math.random() * 4,
          a: Math.random() * Math.PI
        });
      }
      let frames = 0;
      function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.a += 0.08;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.a);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
          ctx.restore();
        });
        frames++;
        if (frames < 180) requestAnimationFrame(tick);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      tick();
    }

    if (localStorage.getItem(KEYS.session) === "1") showApp();
  </script>
</body>
</html>
